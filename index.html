<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MateLabs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: white;
      padding: 30px 15px;
      border-bottom: 2px solid #ddd;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    header p {
      font-size: 18px;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 15px 0;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 14px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .categorias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .oculto {
      display: none;
    }

    #pregunta {
      font-size: 35px;
      font-weight: bold;
      margin: 25px 0;
    }

    #resultado {
      font-size: 22px;
      margin: 20px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 MateLabs</h1>
    <p>Practicá matemática de una manera divertida</p>
  </header>

  <main>

    <!-- INICIO -->
    <section id="inicio" class="card">
      <h2>¡Bienvenido a MateLabs!</h2>

      <p>Escribí tu nombre para comenzar.</p>

      <input
        id="nombre"
        type="text"
        placeholder="Tu nombre"
        maxlength="30"
      >

      <br>

      <button onclick="comenzar()">
        Comenzar
      </button>
    </section>


    <!-- MENÚ -->
    <section id="menu" class="card oculto">

      <h2 id="saludo"></h2>

      <p>Elegí qué querés practicar:</p>

      <div class="categorias">

        <button onclick="iniciarJuego('suma')">
          ➕ Sumas
        </button>

        <button onclick="iniciarJuego('resta')">
          ➖ Restas
        </button>

        <button onclick="iniciarJuego('multiplicacion')">
          ✖️ Multiplicaciones
        </button>

        <button onclick="iniciarJuego('division')">
          ➗ Divisiones
        </button>

        <button onclick="iniciarJuego('mixto')">
          🔢 Mixto
        </button>

      </div>

    </section>


    <!-- JUEGO -->
    <section id="juego" class="card oculto">

      <p>
        Problema <span id="numero">1</span> / 20
      </p>

      <div id="pregunta"></div>

      <input
        id="respuesta"
        type="number"
        placeholder="Respuesta"
      >

      <br>

      <button onclick="comprobar()">
        Responder
      </button>

      <p id="resultado"></p>

    </section>


    <!-- FINAL -->
    <section id="final" class="card oculto">

      <h2>🎉 ¡Terminaste!</h2>

      <p id="puntuacion"></p>

      <button onclick="volverAlMenu()">
        Volver al menú
      </button>

    </section>

  </main>

  <footer>
    MateLabs © 2026
  </footer>


  <script>

    let nombre = "";
    let tipo = "";
    let numeroProblema = 0;
    let puntos = 0;
    let respuestaCorrecta = 0;


    function comenzar() {

      nombre = document.getElementById("nombre").value.trim();

      if (nombre === "") {
        alert("Escribí tu nombre primero.");
        return;
      }

      document.getElementById("inicio").classList.add("oculto");
      document.getElementById("menu").classList.remove("oculto");

      document.getElementById("saludo").textContent =
        "¡Hola, " + nombre + "! 👋";
    }


    function iniciarJuego(categoria) {

      tipo = categoria;
      numeroProblema = 0;
      puntos = 0;

      document.getElementById("menu").classList.add("oculto");
      document.getElementById("juego").classList.remove("oculto");

      siguienteProblema();
    }


    function numeroAleatorio(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }


    function siguienteProblema() {

      numeroProblema++;

      if (numeroProblema > 20) {
        terminar();
        return;
      }

      document.getElementById("numero").textContent = numeroProblema;

      document.getElementById("resultado").textContent = "";

      document.getElementById("respuesta").value = "";

      let operacion = tipo;

      if (tipo === "mixto") {

        const operaciones = [
          "suma",
          "resta",
          "multiplicacion",
          "division"
        ];

        operacion =
          operaciones[
            numeroAleatorio(0, operaciones.length - 1)
          ];
      }


      let a;
      let b;


      if (operacion === "suma") {

        a = numeroAleatorio(10, 999);
        b = numeroAleatorio(10, 999);

        respuestaCorrecta = a + b;

        mostrarPregunta(a + " + " + b + " = ?");
      }


      else if (operacion === "resta") {

        a = numeroAleatorio(10, 999);
        b = numeroAleatorio(10, a);

        respuestaCorrecta = a - b;

        mostrarPregunta(a + " − " + b + " = ?");
      }


      else if (operacion === "multiplicacion") {

        a = numeroAleatorio(2, 20);
        b = numeroAleatorio(2, 20);

        respuestaCorrecta = a * b;

        mostrarPregunta(a + " × " + b + " = ?");
      }


      else if (operacion === "division") {

        b = numeroAleatorio(2, 20);

        respuestaCorrecta =
          numeroAleatorio(2, 20);

        a = b * respuestaCorrecta;

        mostrarPregunta(a + " ÷ " + b + " = ?");
      }
    }


    function mostrarPregunta(texto) {

      document.getElementById("pregunta").textContent = texto;
    }


    function comprobar() {

      const respuesta =
        Number(document.getElementById("respuesta").value);

      const mensaje =
        document.getElementById("resultado");


      if (
        document.getElementById("respuesta").value === ""
      ) {

        mensaje.textContent =
          "Escribí una respuesta.";

        return;
      }


      if (respuesta === respuestaCorrecta) {

        puntos++;

        mensaje.textContent =
          "✅ ¡Correcto!";

      } else {

        mensaje.textContent =
          "❌ Incorrecto. La respuesta era " +
          respuestaCorrecta;
      }


      setTimeout(() => {

        siguienteProblema();

      }, 1000);
    }


    function terminar() {

      document.getElementById("juego").classList.add("oculto");
      document.getElementById("final").classList.remove("oculto");

      document.getElementById("puntuacion").textContent =
        nombre +
        ", conseguiste " +
        puntos +
        " de 20 puntos.";
    }


    function volverAlMenu() {

      document.getElementById("final").classList.add("oculto");
      document.getElementById("menu").classList.remove("oculto");
    }

  </script>

</body>
</html>
