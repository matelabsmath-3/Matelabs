let datos=Object.assign({},BASE,JSON.parse(localStorage.getItem("matelabsDatos")||"{}"));

while(datos.extraWins.length<8)datos.extraWins.push(false);

function save(){localStorage.setItem("matelabsDatos",JSON.stringify(datos))}  
function today(){return new Date().toISOString().slice(0,10)}  
  
function updateDay(){  
 const h=today();  
 if(datos.ultimoDia!==h){  
   const d=new Date();d.setDate(d.getDate()-1);  
   datos.racha=datos.ultimoDia===d.toISOString().slice(0,10)?datos.racha+1:1;  
   datos.mejorRacha=Math.max(datos.mejorRacha,datos.racha);  
   datos.ultimoDia=h;datos.retoDia=false;save();  
 }  
}  
  
function rank(){  
 let r=RANGOS[0];for(const x of RANGOS)if(datos.trofeos>=x[0])r=x;return r;  
}  
  
function nextRank(){return RANGOS.find(x=>x[0]>rank()[0])||null}  
function rankPct(){let n=nextRank();if(!n)return 100;return Math.min(100,Math.max(0,(datos.trofeos-rank()[0])/(n[0]-rank()[0])*100))}  
function xpNeeded(){return datos.nivel*100}  
  
function addXP(n){  
 datos.xp+=n;  
 while(datos.xp>=xpNeeded()){datos.xp-=xpNeeded();datos.nivel++;datos.monedas+=25}  
}  
  
function trophyReward(base){return Math.max(1,Math.round(base*(datos.skinMultiplier||1.25)))}  
  
function setTrophies(value){  
 const antes=datos.trofeos;  
 datos.trofeos=Math.min(500,Math.max(0,value));  
 save();  
 if(antes<500&&datos.trofeos>=500&&!datos.final500Shown){  
  datos.final500Shown=true;  
  save();  
  setTimeout(show500Final,250);  
 }  
}  
  
function addTrophies(base){setTrophies(datos.trofeos+trophyReward(base))}

}

 setTrophies(datos.trofeos+1);datos.puntos+=25;datos.monedas+=15;

function closeM(){document.getElementById("modal")?.remove()}

 modal(`<div class="modalhead"><h2>Elegí dificultad</h2><button class="close" onclick="closeM()">×</button></div><div class="choices">

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}  
  
function qNormal(level){  
 if(level==="basic"){let a=rand(4,40),b=rand(2,20),o=rand(0,2);return o===0?{q:`${a}+${b}`,a:a+b}:o===1?{q:`${a}−${b}`,a:a-b}:{q:`${a}×${b}`,a:a*b}}  
 if(level==="intermediate"){let a=rand(3,20),b=rand(2,12),c=rand(1,15);return Math.random()<.5?{q:`${a}×${b}+${c}`,a:a*b+c}:{q:`${a*b}÷${b}`,a:a}}  
 let a=rand(3,14),b=rand(2,10),c=rand(2,8);return Math.random()<.5?{q:`(${a}+${b})×${c}`,a:(a+b)*c}:{q:`${a}²−${b}×${c}`,a:a*a-b*c}  
}  
  
function cuentaRegresiva(callback){  
 clearInterval(timer);document.getElementById("modal")?.remove();  
 const old=document.getElementById("countdown");if(old)old.remove();  
 document.body.insertAdjacentHTML("beforeend",`<div id="countdown" class="countdown-screen"><div id="countNum">3</div><div class="countSub">PREPARATE</div></div>`);  
 const el=document.getElementById("countNum");let n=3;el.textContent=n;  
 const iv=setInterval(()=>{n--;if(n>0){el.textContent=n}else{clearInterval(iv);document.getElementById("countdown")?.remove();callback()}},900);  
}  
  
function start(level){closeM();juego={level,total:10,n:0,correct:0,wrong:0,streak:0,time:30,position:9,stability:100};cuentaRegresiva(()=>nextQ())}  
function nextQ(){if(juego.n>=juego.total)return finish();juego.q=qNormal(juego.level);juego.n++;juego.time=30;renderGame();runTimer()}  
function runTimer(){clearInterval(timer);timer=setInterval(()=>{juego.time--;document.getElementById("time")?.replaceChildren("⏱️ "+juego.time+" s");if(juego.time<=0){clearInterval(timer);answer(false,true)}},1000)}  
  
function renderGame(){  
 const secret=maybeSecret();  
 const arenaClass=juego.piola?"arena piola":"arena";  
 shell(`<div class="card game"><span class="pill">${juego.level.toUpperCase()}</span>${juego.piola?`<div class="chill-badge">😎 MODO PIOLA • Sin presión</div>`:""}<div class="row tiny"><span>Pregunta ${juego.n}/${juego.total}</span><span>🔥 ${juego.streak}</span></div>  
 <div id="time" class="timer">⏱️ ${juego.time} s</div>  
 <div class="arena ${arenaClass}" id="arena"><span class="distance">META →</span><span class="stability" id="stability">🛡️ ${Math.round(juego.stability||100)}%</span><div class="char" id="char" style="left:${juego.position||9}%"><div class="head"><div class="eye"></div></div><div class="bodyman"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div>${secret?`<div id="secretEyeEvent" class="secret-eye-event" onclick="claimSecret()">👁️‍🗨️</div>`:""}<div class="sword"></div><div class="weaponText">${juego.q.q}</div><div class="weaponIcon">⚔️</div><div class="weaponLabel">⚔️ ¡ATAQUE!</div><div class="impact"></div><div class="ground"></div></div>  
 <div class="q">${juego.q.q}</div><input id="ans" class="answer" inputmode="decimal" placeholder="Tu respuesta" onkeydown="if(event.key==='Enter')answer()">  
 <div class="gameactions"><button class="primary" onclick="answer()">RESPONDER</button><button class="secondary" onclick="quit()">Salir</button></div><div id="fb" class="feedback"></div></div>`);  
 setTimeout(()=>document.getElementById("ans")?.focus(),40)  
}  
  
function animate(ok){  
 const arena=document.getElementById("arena"),ch=document.getElementById("char");  
 if(!arena||!ch)return;  
 if(ok){  
   juego.position=Math.min(82,9+juego.correct*7);  
   ch.style.left=juego.position+"%";  
   arena.classList.add("advance");  
   setTimeout(()=>arena.classList.remove("advance"),650);  
 }else{  
   juego.stability=Math.max(0,100-(juego.wrong/juego.total)*100);  
   const st=document.getElementById("stability");  
   if(st){st.textContent="🛡️ "+Math.round(juego.stability)+"%";st.classList.toggle("danger",juego.stability<=20)}  
   arena.classList.add("hit");  
   setTimeout(()=>arena.classList.remove("hit"),5000);  
 }  
}  
  
function makeFall(){  
 const arena=document.getElementById("arena"),ch=document.getElementById("char");if(!arena)return;  
 arena.classList.remove("hit");arena.classList.add("hanging");  
 const fb=document.getElementById("fb");  
 if(fb){fb.textContent="🫳 ¡AGARRADO! Último golpe...";fb.style.color="var(--red)"}  
 setTimeout(()=>{  
   arena.classList.remove("hanging");arena.classList.add("fall");  
   if(fb)fb.textContent="💥 ¡SE CAYÓ! Perdiste la partida.";  
   setTimeout(()=>finishFall(),950);  
 },5000);  
}  
  
function finishFall(){clearInterval(timer);datos.partidas++;save();shell(`<div class="card result"><div class="big">💥</div><h2>¡Perdiste!</h2><p>El muñeco perdió todo el equilibrio y finalmente se cayó.</p><div class="note">Fallaste ${juego.wrong} ejercicios. ¡Volvé a intentarlo!</div><button class="primary" onclick="menu()">VOLVER</button></div>`)}  
  
function answer(force=null,timeout=false){  
 if(!juego)return;if(juego.secretEye){claimSecret();return}clearInterval(timer);  
 let raw=document.getElementById("ans")?.value?.replace(",",".")||"";let ok=force!==null?force:(raw!==""&&Math.abs(Number(raw)-juego.q.a)<.0001);  
 datos.ejerciciosTotales++;  
 if(ok){datos.correctasTotales++;juego.correct++;juego.streak++;addXP(15);datos.puntos+=3;datos.monedas+=2;document.getElementById("fb").textContent="✅ ¡Correcto! El personaje avanza.";document.getElementById("fb").style.color="var(--green)"}  
 else{juego.streak=0;juego.wrong++;document.getElementById("fb").textContent=timeout?"⏰ ¡TIEMPO! ⚔️":"❌ ¡FALLIDO! ⚔️";document.getElementById("fb").style.color="var(--red)"}  
 animate(ok);datos.historial.push(ok?1:0);datos.historial=datos.historial.slice(-30);save();if(!ok&&juego.wrong>=juego.total){makeFall();return}setTimeout(nextQ,5000)  
}  
  
function quit(){clearInterval(timer);juego=null;menu()}  
  
function finish(){  
 clearInterval(timer);datos.partidas++;  
 if(datos.partidas>=5)unlockSecret(6);  
 let perfect=juego.correct===juego.total;  
 if(perfect){setTrophies(datos.trofeos+1);unlockSecret(7);datos.puntos+=10;datos.monedas+=15}  
 save();  
 shell(`<div class="card result"><div class="big">${perfect?"🏆":"🧠"}</div><h2>${perfect?"¡Partida perfecta!":"Entrenamiento terminado"}</h2><p>${juego.correct}/${juego.total} correctas</p><div class="stats"><div class="stat"><b>${juego.correct*3}</b><span>Puntos base</span></div><div class="stat"><b>${perfect?"+1":"0"}</b><span>Trofeos</span></div><div class="stat"><b>+${juego.correct*15}</b><span>XP</span></div><div class="stat"><b>+${juego.correct*2+(perfect?15:0)}</b><span>Monedas</span></div></div><button class="primary" onclick="menu()">VOLVER</button></div>`)  
}

function challenge(){closeM();juego={level:"muy-desafio",total:12,n:0,correct:0,wrong:0,streak:0,time:25,diff:1,position:9,stability:100};cuentaRegresiva(()=>nextChallenge())}  
  
function qChallenge(){  
 let d=Math.min(6,1+Math.floor(juego.n/2)),a=rand(3,8+d),b=rand(2,7+d),c=rand(1,6+d);  
 if(d<3)return Math.random()<.5?{q:`${a}×${b}−${c}`,a:a*b-c}:{q:`(${a}+${b})×${c}`,a:(a+b)*c};  
 return Math.random()<.5?{q:`${a}²−${b}×${c}`,a:a*a-b*c}:{q:`(${a}+${b})²−${c}²`,a:(a+b)**2-c*c};  
}  
  
function nextChallenge(){if(juego.n>=juego.total)return finishChallenge();juego.q=qChallenge();juego.n++;juego.time=Math.max(12,25-Math.floor(juego.n/3));renderChallenge();runTimer()}  
  
function renderChallenge(){shell(`<div class="card game"><span class="pill">⚔️ MUY DESAFÍO • RONDA ${juego.n}/${juego.total}</span><div class="row tiny"><span>Dificultad ${Math.min(6,1+Math.floor((juego.n-1)/2))}/6</span><span>🔥 ${juego.streak}</span></div><div id="time" class="timer">⏱️ ${juego.time} s</div><div class="arena" id="arena"><span class="stability" id="stability">🛡️ ${Math.round(juego.stability||100)}%</span><div class="char" id="char" style="left:${juego.position||9}%"><div class="head"><div class="eye"></div></div><div class="bodyman"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div><div class="sword"></div><div class="weaponText">${juego.q.q}</div><div class="weaponIcon">⚔️</div><div class="weaponLabel">⚔️ ¡ATAQUE!</div><div class="impact"></div><div class="ground"></div></div><div class="q">${juego.q.q}</div><input id="ans" class="answer" inputmode="decimal" placeholder="Respuesta" onkeydown="if(event.key==='Enter')challengeAnswer()"><button class="primary" onclick="challengeAnswer()">RESPONDER</button><div id="fb" class="feedback"></div></div>`);setTimeout(()=>document.getElementById("ans")?.focus(),40)}  
  
function challengeAnswer(){if(!juego)return;if(juego.secretEye){claimSecret();return}clearInterval(timer);let raw=document.getElementById("ans")?.value?.replace(",",".")||"";let ok=raw!==""&&Math.abs(Number(raw)-juego.q.a)<.0001;datos.ejerciciosTotales++;if(ok){datos.correctasTotales++;juego.correct++;juego.streak++;addXP(20);datos.puntos+=5;datos.monedas+=3;document.getElementById("fb").textContent="⚡ ¡Avanzás de ronda!";document.getElementById("fb").style.color="var(--green)"}else{juego.streak=0;juego.wrong++;document.getElementById("fb").textContent="❌ ¡FALLIDO! ⚔️";document.getElementById("fb").style.color="var(--red)"}animate(ok);save();if(!ok&&juego.wrong>=juego.total){makeFall();return}setTimeout(nextChallenge,5000)}  
  
function finishChallenge(){clearInterval(timer);datos.partidas++;if(juego.correct===12){setTrophies(datos.trofeos+3);datos.monedas+=30}save();shell(`<div class="card result"><div class="big">⚔️${juego.correct===12?"🏆":"🧠"}</div><h2>${juego.correct===12?"¡MUY DESAFÍO SUPERADO!":"Desafío terminado"}</h2><p>${juego.correct}/12 correctas</p><button class="primary" onclick="menu()">VOLVER</button></div>`)}

 window.pick=function(i){if(showing)return;user.push(i);document.getElementById('m'+i)?.classList.add('lit');setTimeout(()=>document.getElementById('m'+i)?.classList.remove('lit'),180);let k=user.length-1;if(user[k]!==seq[k]){draw();document.getElementById('memoryMsg').innerHTML=`❌ Te equivocaste en la ronda ${round}.<br><button class="secondary" style="margin-top:10px" onclick="miniGames()">VOLVER</button>`;return}if(user.length===seq.length){if(round>=5){let t=miniReward(1,40,20);draw();document.getElementById('memoryMsg').innerHTML=`🧠🌈 ¡Memoria completada! +${t} 🏆<br><button class="primary" style="margin-top:10px" onclick="miniGames()">VOLVER</button>`}else setTimeout(newRound,450)}}  
 newRound();  
}  
  
function flashGame(){  
 let n=0,correct=0,a=0,b=0,op='',ans=0,timerId=null;  
 function next(){n++;a=rand(8,45);b=rand(2,15);let type=Math.floor(Math.random()*3);if(type===0){op='+';ans=a+b}else if(type===1){op='−';if(b>a)[a,b]=[b,a];ans=a-b}else{op='×';a=rand(2,12);b=rand(2,9);ans=a*b}draw();document.getElementById('flashAns')?.focus()}  
 function draw(){modal(`<div class="modalhead"><h2>🔢 Número relámpago</h2><button class="close" onclick="clearTimeout(timerId);closeM()">×</button></div><div class="pill">CUENTA ${n}/5</div><div class="q">${a} ${op} ${b}</div><input id="flashAns" class="answer" inputmode="numeric" placeholder="Respuesta" onkeydown="if(event.key==='Enter')answer()"><button class="primary" onclick="answer()">RESPONDER</button><div id="flashMsg" class="feedback">⏱️ Tenés 8 segundos.</div>`);let left=8;timerId=setInterval(()=>{left--;let m=document.getElementById('flashMsg');if(m)m.textContent=`⏱️ ${left} segundos`;if(left<=0){clearInterval(timerId);finish(false,'⏰ Tiempo agotado.')}},1000);setTimeout(()=>document.getElementById('flashAns')?.focus(),30)}  
 function answer(){clearInterval(timerId);let v=Number(document.getElementById('flashAns')?.value);if(v===ans)correct++;if(n>=5){finish(correct===5,`Acertaste ${correct}/5.`)}else setTimeout(next,250)}  
 function finish(win,msg){let t=win?miniReward(2,50,25):0;modal(`<div class="result"><div class="big">${win?'⚡🏆':'🧮'}</div><h2>${win?'¡COMPLETADO!':'Fin del juego'}</h2><p>${msg}</p><div class="note">${win?`+${t} 🏆 y recompensas.`:'Podés intentarlo de nuevo.'}</div><button class="primary" onclick="miniGames()">VOLVER</button></div>`)}  
 window.answer=answer;window.flashFinish=finish;next();  
}

function trophies(){

 const sec=datos.secretTrophies||[];  
 const secretNames=[

  'Maestro de desafíos','Laboratorio oculto','Número perfecto','El toque Σ','Easter egg final'  
 ];

  'Encontrá el ojo secreto durante una partida y tocálo.','Completá Modo Muñequito Piola.','Superá Modo Pesadilla con las 5 correctas.',  
  'Abrí el código secreto y descubrí la combinación escondida.','Conseguí una racha de 10 respuestas correctas.',  
  'Completá 8 modos de Más modos.','Completá 5 partidas.','Conseguí una partida perfecta.',  
  'Tocá el logo Σ 7 veces.','Descubrí todos los easter eggs.'  
 ];

 }).join('');  
 const secretGrid=secretNames.map((name,i)=>`<button class="secret-card ${sec[i]?'earned':''}" onclick="secretInfo(${i})"><span>${sec[i]?'🌈🏆':'🌈❓'}</span><b>!!! ${name}</b><small>${sec[i]?'DESBLOQUEADO':'SECRETO'}</small></button>`).join('');  
 const easter=`<div class="section"><h3>🥚 Easter eggs</h3><p class="tiny">Hay secretos escondidos por MateLabs. Algunos se descubren jugando y otros observando.</p><div class="choicegrid">  
  <button class="item" onclick="logoEasterEgg()"><b>Σ El logo misterioso</b><small>Tocá el logo 7 veces. Progreso: ${Math.min(7,datos.logoClicks||0)}/7</small></button>  
  <button class="item" onclick="codeEasterEgg()"><b>🔢 Código secreto</b><small>Probá descubrir la combinación matemática.</small></button>  
  </div></div>`;  
 modal(`<div class="modalhead"><h2>🏆 Trofeos de MateLabs</h2><button class="close" onclick="closeM()">×</button></div>  
 <div class="trophy-summary"><div><b>${got}/500</b><span>Trofeos</span></div><div><b>${datos.secretFound||0}/10</b><span>Secretos</span></div></div>  
 <div class="progress"><i style="width:${got/5}%"></i></div>  
 <p class="tiny" style="margin-top:8px">Cada casillero representa un trofeo. Los bloqueados se van descubriendo a medida que avanzás.</p>  
 <div class="trophy-grid">${trophyGrid}</div>  
 <div class="section"><h3>🌈 Trofeos secretos</h3><div class="secret-trophies secret10">${secretGrid}</div></div>  
 ${easter}  
 <button class="secondary" style="width:100%;margin-top:14px" onclick="ranks()">👑 VER RANGOS</button>`)  
}  
  
function secretInfo(i){  
 const sec=datos.secretTrophies||[];const unlocked=!!sec[i];  
 const names=['El ojo perdido','Muñequito Piola','Pesadilla','Código Mate','Maestro de rachas','Maestro de desafíos','Laboratorio oculto','Número perfecto','El toque Σ','Easter egg final'];  
 const methods=['Encontrá y tocá el ojo durante un ejercicio.','Completá Modo Muñequito Piola.','Superá Modo Pesadilla con 5/5.','Descubrí el Código Mate.','Llegá a una racha de 10.','Completá 8 modos de Más modos.','Completá 5 partidas.','Conseguí una partida perfecta.','Tocá el logo Σ 7 veces.','Desbloqueá los otros 9 secretos.'];  
 modal(`<div class="result"><div class="big">${unlocked?'🌈🏆':'🌈❓'}</div><h2>${unlocked?'¡Secreto desbloqueado!':'Trofeo secreto'}</h2><h3>${names[i]}</h3><p>${methods[i]}</p><div class="note">${unlocked?'DESBLOQUEADO':'Todavía oculto.'}</div><button class="primary" onclick="trophies()">VOLVER A TROFEOS</button></div>`)  
}  
  
function unlockSecret(i){  
 if(!Array.isArray(datos.secretTrophies))datos.secretTrophies=Array(10).fill(false);  
 while(datos.secretTrophies.length<10)datos.secretTrophies.push(false);  
 if(datos.secretTrophies[i])return;  
 datos.secretTrophies[i]=true;  
 datos.secretFound=(datos.secretFound||0)+1;  
 setTrophies(datos.trofeos+1);  
 save();  
 // El secreto #10 aparece automáticamente al descubrir los otros 9.  
 if(i!==9 && datos.secretFound>=9 && !datos.secretTrophies[9]){  
   datos.secretTrophies[9]=true;  
   datos.secretFound++;  
   setTrophies(datos.trofeos+1);  
   save();  
   setTimeout(()=>alert('🌈 ¡EASTER EGG FINAL DESBLOQUEADO! Encontraste los 10 secretos.'),150);  
 }  
}  
  
function logoEasterEgg(){  
 datos.logoClicks=(datos.logoClicks||0)+1;  
 if(datos.logoClicks>=7){unlockSecret(8);alert('🥚 ¡Easter egg descubierto! El logo Σ escondía un secreto.');}  
 else alert('Σ ...algo parece reaccionar. '+datos.logoClicks+'/7');  
 save();  
}  
  
function codeEasterEgg(){  
 const code=prompt('🔢 Encontrá el código de MateLabs. Pista: los primeros dígitos de π.');  
 if((code||'').trim()==='314159'){if(!datos.easterCode){datos.easterCode=true;unlockSecret(3);alert('🥚 ¡CÓDIGO CORRECTO! Descubriste un secreto.')}else alert('✅ Ya descubriste este easter egg.');}  
 else if(code!==null)alert('❌ Código incorrecto.');  
}
