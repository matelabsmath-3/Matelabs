<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>MateLabs 3.7 — Mini juegos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070b;--card:#111119;--card2:#181822;--text:#fff;--muted:#9b9bab;--purple:#9b5cff;--green:#31e981;--yellow:#ffd83d;--red:#ff4d67;--line:#ffffff14}
body.light{--bg:#f4f5f9;--card:#fff;--card2:#eef0f6;--text:#11121a;--muted:#696b78;--line:#00000012}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#9b5cff28,transparent 30%),radial-gradient(circle at 90% 10%,#31e9811c,transparent 27%),var(--bg);color:var(--text);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}input{outline:0}
.hidden{display:none!important}.wrap{width:min(1120px,100%);margin:auto;padding:14px}.screen{min-height:100vh;display:grid;place-items:center;padding:15px}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 70px #0007}
.login{width:min(470px,100%);padding:34px}.brand{text-align:center}.logo{width:112px;height:112px;margin:auto;border:4px solid white;border-radius:31px;display:grid;place-items:center;background:linear-gradient(135deg,#000 0 25%,var(--purple) 25% 48%,var(--green) 48% 73%,var(--yellow) 73%);box-shadow:0 0 45px #9b5cff45;overflow:hidden}.logo span{font-size:60px;font-weight:1000;text-shadow:3px 3px #000}.brand h1{font-size:43px;margin-top:15px;letter-spacing:-2px}.gradient{background:linear-gradient(90deg,var(--purple),var(--green),var(--yellow));-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);margin-top:4px}.field{margin-top:20px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:7px}.field input,.answer{width:100%;padding:15px;border-radius:16px;border:1px solid var(--line);background:#0004;color:var(--text)}.field input:focus,.answer:focus{border-color:var(--purple);box-shadow:0 0 0 4px #9b5cff1a}.primary{width:100%;padding:15px;border-radius:16px;background:linear-gradient(90deg,var(--purple),#6975ff,var(--green));font-weight:1000;margin-top:15px;box-shadow:0 10px 25px #6e74ff25}.secondary{padding:13px 15px;border-radius:15px;background:var(--card2);border:1px solid var(--line);font-weight:800}.error{min-height:20px;text-align:center;color:var(--red);font-size:13px;font-weight:800;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brandmini{display:flex;align-items:center;gap:10px;font-weight:1000}.minilogo{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;border:2px solid white;background:linear-gradient(135deg,#000,var(--purple),var(--green),var(--yellow))}.minilogo span{font-weight:1000;font-size:23px}.icon{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.hero{padding:24px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-130px;top:-130px;background:#9b5cff22}.tiny{font-size:12px;color:var(--muted)}.hero h2{font-size:clamp(25px,6vw,38px);margin-top:4px}.progress{height:9px;border-radius:20px;background:#ffffff0d;overflow:hidden;margin-top:16px}.progress i{height:100%;display:block;border-radius:20px;background:linear-gradient(90deg,var(--purple),var(--green),var(--yellow))}.row{display:flex;justify-content:space-between;gap:8px;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.stat{padding:17px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.stat b{font-size:26px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{margin-top:20px}.section h3{margin-bottom:10px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu button{padding:20px;text-align:left;border-radius:21px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);transition:.16s}.menu button:hover{transform:translateY(-2px);border-color:#9b5cff66}.ico{font-size:28px}.menu strong{display:block;font-size:17px;margin-top:6px}.menu small{color:var(--muted)}.tag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:99px;background:#31e98118;color:var(--green);font-size:10px;font-weight:1000}.note{margin-top:13px;padding:13px;border-radius:15px;background:#ffd83d0c;border:1px solid #ffd83d22;color:var(--muted);font-size:12px}
.modal{position:fixed;z-index:20;inset:0;background:#000b;backdrop-filter:blur(8px);display:grid;place-items:center;padding:15px}.modalbox{width:min(650px,100%);max-height:91vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{background:none;font-size:28px;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choices button{padding:17px;text-align:left;border-radius:17px;background:var(--card2);border:1px solid var(--line)}.choices b{display:block}.choices small{color:var(--muted)}.locked{opacity:.42!important;cursor:not-allowed}
.game{padding:20px;text-align:center}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#9b5cff18;color:var(--purple);font-size:10px;font-weight:1000}.timer{font-weight:1000;color:var(--yellow);margin-top:10px}.q{font-size:clamp(34px,10vw,65px);font-weight:1000;margin:22px 0}.answer{text-align:center;font-size:24px}.gameactions{display:flex;gap:9px}.gameactions>*{flex:1}.feedback{height:30px;padding-top:8px;font-weight:1000}.result{text-align:center;padding:30px}.big{font-size:62px}.result h2{font-size:30px}.result p{color:var(--muted);margin:5px 0}.choicegrid{display:grid;gap:10px}.item{padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}.item small{display:block;color:var(--muted);margin-top:3px}.current{border-color:var(--yellow)}.chart{height:170px;padding:18px;display:flex;align-items:end;gap:6px;background:var(--card2);border-radius:18px}.bar{flex:1;height:var(--h);border-radius:8px 8px 2px 2px;background:linear-gradient(to top,var(--purple),var(--green),var(--yellow))}
.night{background:#030305;border-color:#292933}.skull{font-size:60px}.night h2{color:white}.night .q{color:white}
.arena{position:relative;height:180px;margin:12px 0 4px;overflow:hidden;border-radius:22px;background:linear-gradient(#0b0b13,#13131e);border:1px solid var(--line)}
.ground{position:absolute;bottom:27px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--green),var(--yellow))}
.char{position:absolute;left:9%;bottom:28px;width:62px;height:82px;transition:left .8s cubic-bezier(.2,.8,.2,1),bottom .8s,transform .25s;z-index:3;transform-origin:50% 100%}
.head{width:36px;height:36px;border-radius:50%;background:#ffd0a6;border:3px solid #111;margin:auto;position:relative}.eye{position:absolute;width:5px;height:5px;background:#111;border-radius:50%;top:12px;left:9px;box-shadow:13px 0 #111}.bodyman{width:42px;height:42px;margin:-1px auto 0;border-radius:13px 13px 8px 8px;background:linear-gradient(135deg,var(--purple),var(--green));border:3px solid #111}.leg{position:absolute;bottom:-5px;width:12px;height:27px;background:#333;border-radius:7px}.leg.l{left:17px}.leg.r{right:17px}
.arm{position:absolute;top:34px;width:25px;height:9px;background:#ffd0a6;border:3px solid #111;border-radius:9px;z-index:2}.arm.l{left:0;transform:rotate(20deg)}.arm.r{right:0;transform:rotate(-20deg)}
.sword{position:absolute;left:calc(9% + 18px);top:-70px;width:10px;height:86px;border-radius:9px;background:linear-gradient(180deg,#fff,#bfc6d2);transform:rotate(10deg);opacity:0;z-index:6;box-shadow:0 0 15px #fff}.sword:after{content:"";position:absolute;left:-6px;bottom:-13px;width:22px;height:18px;border-radius:4px;background:var(--yellow)}
.impact{position:absolute;width:70px;height:35px;border-radius:50%;left:9%;bottom:108px;opacity:0;pointer-events:none;z-index:7;background:radial-gradient(circle,#fff 0 7%,#ff4d67 8% 18%,transparent 20%);filter:drop-shadow(0 0 10px #ff4d67)}
.weaponText{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(28px,8vw,58px);font-weight:1000;z-index:8;pointer-events:none;text-shadow:0 0 18px #9b5cff;opacity:0}.weaponIcon{position:absolute;left:50%;top:35%;font-size:60px;transform:translate(-50%,-50%) rotate(-18deg) scale(.2);opacity:0;z-index:9;pointer-events:none;filter:drop-shadow(0 0 12px #fff)}
.hit .sword{animation:swordHit5 5s ease-in-out}.hit .impact{animation:impactBurst .8s ease .58s}.hit .char{animation:wobbleHit5 5s ease-in-out}.hit .weaponText{animation:textToWeapon 5s ease-in-out}.hit .weaponIcon{animation:weaponFly 5s ease-in-out}.advance .char{animation:jump .65s ease}.fall .char{animation:fallDown .9s cubic-bezier(.7,0,1,.45) forwards}.fall .sword{animation:none!important}.hanging .char{bottom:18px;animation:hangTense 1s ease-in-out infinite alternate}.hanging .arm.l{transform:rotate(72deg);left:8px}.hanging .arm.r{transform:rotate(-72deg);right:8px}.arena.fall{border-color:#ff4d6766;box-shadow:0 0 35px #ff4d6725 inset}.danger{color:var(--red)!important}
@keyframes swordHit5{0%{opacity:0;top:-70px;transform:rotate(10deg)}10%{opacity:1}45%{opacity:1;top:50px;transform:rotate(10deg)}53%{top:43px;transform:rotate(-10deg)}70%{top:65px;opacity:1}100%{top:120px;opacity:0;transform:rotate(-25deg)}}
@keyframes textToWeapon{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}12%{opacity:1}32%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-3deg)}48%{opacity:.2;transform:translate(-50%,-50%) scale(.55) rotate(-12deg)}58%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-25deg)}}
@keyframes weaponFly{0%,35%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scale(.2)}48%{opacity:1;transform:translate(-50%,-50%) rotate(-18deg) scale(1)}62%{opacity:1;transform:translate(-15%,-5%) rotate(-45deg) scale(1.05)}72%{opacity:1;transform:translate(-8%,15%) rotate(-65deg) scale(1.1)}100%{opacity:0;transform:translate(-8%,15%) rotate(-75deg) scale(.8)}}
@keyframes impactBurst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.8)}}
@keyframes wobbleHit5{0%{transform:rotate(0)}12%{transform:rotate(-4deg)}25%{transform:rotate(7deg) translateX(3px)}38%{transform:rotate(-10deg) translateX(-5px)}52%{transform:rotate(14deg) translateX(6px)}68%{transform:rotate(-18deg) translateX(-7px)}82%{transform:rotate(12deg) translateX(5px)}100%{transform:rotate(0)}}
@keyframes jump{35%{transform:translateY(-22px)}70%{transform:translateY(0)}}@keyframes hangTense{from{transform:rotate(8deg) translateX(-2px)}to{transform:rotate(15deg) translateX(2px)}}@keyframes fallDown{0%{transform:rotate(15deg) translateY(0)}35%{transform:rotate(25deg) translateY(-2px)}65%{transform:rotate(72deg) translateY(12px)}100%{transform:rotate(90deg) translateY(38px);opacity:.7}}.distance{position:absolute;top:10px;left:10px;color:var(--muted);font-size:10px}.stability{position:absolute;top:10px;right:10px;color:var(--muted);font-size:10px;font-weight:900}.weaponLabel{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-weight:900;opacity:0;z-index:10}.hit .weaponLabel{animation:label5 5s ease}.hanging .weaponLabel{opacity:1;color:var(--red)}@keyframes label5{0%,70%{opacity:0}72%,92%{opacity:1}100%{opacity:0}}
.secret-trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.rainbow-trophy{position:relative;border:2px solid transparent;border-radius:18px;padding:18px;text-align:center;background:linear-gradient(var(--card2),var(--card2)) padding-box,linear-gradient(135deg,#ff3d81,#ffcc33,#31e981,#42a5ff,#9b5cff) border-box;box-shadow:0 0 20px #9b5cff25;transition:.25s}.rainbow-trophy:not(.unlocked){opacity:.55;filter:grayscale(.4)}.rainbow-trophy.unlocked{animation:rainbowPulse 1.8s infinite alternate}.rainbow-trophy button{background:none;width:100%;font-size:42px}.rainbow-trophy small{display:block;color:var(--muted);margin-top:5px}.secret-eye{position:absolute;right:8px;top:8px;font-size:10px;color:var(--muted)}
.piola .arena{background:radial-gradient(circle at 50% 20%,#9b5cff22,transparent 45%),linear-gradient(#10121b,#171728)}.piola .char{filter:drop-shadow(0 0 8px #31e98166)}.piola .head{background:#ffd7ad}.piola .bodyman{background:linear-gradient(135deg,#31e981,#42a5ff)}.piola .arm.l{transform:rotate(8deg)}.piola .arm.r{transform:rotate(-8deg)}.chill-badge{display:inline-block;margin:8px auto;padding:7px 12px;border-radius:999px;background:#31e98118;color:var(--green);font-weight:900;font-size:12px}
.secret-eye-event{position:absolute;left:calc(var(--char-left,9%) + 24px);bottom:126px;z-index:20;font-size:25px;cursor:pointer;animation:secretPop .7s ease-out,secretGlow 1s infinite alternate}.secret-eye-event:active{transform:scale(.9)}
@keyframes rainbowPulse{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-4px) rotate(1deg);box-shadow:0 0 28px #ffd83d55}}@keyframes secretPop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}@keyframes secretGlow{from{filter:drop-shadow(0 0 2px #9b5cff)}to{filter:drop-shadow(0 0 12px #ffd83d)}}
@media(max-width:700px){.secret-trophies{grid-template-columns:1fr}}
footer{text-align:center;color:var(--muted);font-size:10px;padding:22px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.wrap{padding:10px}}
.reaction-box{height:190px;border-radius:24px;margin-top:14px;background:linear-gradient(145deg,#171721,#0c0c12);border:2px solid var(--red);display:grid;place-items:center;text-align:center;cursor:pointer;user-select:none}.reaction-box.go{border-color:var(--green);background:linear-gradient(145deg,#0e2419,#123d25);box-shadow:0 0 35px #31e98155}.reaction-box b{display:block;font-size:34px}.reaction-box small{display:block;color:var(--muted);margin-top:5px}.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.memory-grid button{height:105px;border:2px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--card),var(--card2));cursor:pointer}.memory-grid button.lit{transform:scale(.96);box-shadow:0 0 30px #9b5cffaa;background:linear-gradient(145deg,var(--purple),var(--green))}.mini-grid .item{min-height:190px}.mini-grid .ico{font-size:40px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

const CONTRASENA="Matelab123";
const PESADILLA="Secret available";

const RANGOS=[
 [0,"Principiante"],[5,"Aprendiz"],[10,"Entrenado"],[20,"Experto Junior"],
 [30,"Avanzado"],[40,"Experto"],[50,"Maestro MateLabs"],[75,"Gran Maestro MateLabs"],[100,"Leyenda MateLabs"]
];

const BASE={
 trofeos:0,puntos:0,xp:0,nivel:1,partidas:0,mejorRacha:0,racha:0,
 ejerciciosTotales:0,correctasTotales:0,ultimoDia:"",retoDia:false,tema:"dark",
 historial:[],monedas:0,logros:[],liga:"Bronce",avatar:"🧠",skinMultiplier:1.25,secretTrophies:[false,false,false],secretEye:false,secretFound:0,miniWins:[false,false,false]
};

let datos=Object.assign({},BASE,JSON.parse(localStorage.getItem("matelabsDatos")||"{}"));
let juego=null,timer=null;

function save(){localStorage.setItem("matelabsDatos",JSON.stringify(datos))}
function today(){return new Date().toISOString().slice(0,10)}
function updateDay(){
 const h=today();
 if(datos.ultimoDia!==h){
   const d=new Date();d.setDate(d.getDate()-1);
   datos.racha=datos.ultimoDia===d.toISOString().slice(0,10)?datos.racha+1:1;
   datos.mejorRacha=Math.max(datos.mejorRacha,datos.racha);
   datos.ultimoDia=h;datos.retoDia=false;save();
 }
}
function rank(){
 let r=RANGOS[0];for(const x of RANGOS)if(datos.trofeos>=x[0])r=x;return r;
}
function nextRank(){return RANGOS.find(x=>x[0]>rank()[0])||null}
function rankPct(){let n=nextRank();if(!n)return 100;return Math.min(100,Math.max(0,(datos.trofeos-rank()[0])/(n[0]-rank()[0])*100))}
function xpNeeded(){return datos.nivel*100}
function addXP(n){
 datos.xp+=n;
 while(datos.xp>=xpNeeded()){datos.xp-=xpNeeded();datos.nivel++;datos.monedas+=25}
}
function trophyReward(base){return Math.max(1,Math.round(base*(datos.skinMultiplier||1.25)))}
function addTrophies(base){datos.trofeos=Math.min(100,datos.trofeos+trophyReward(base));save()}
function maybeSecret(){
 if(datos.secretFound>=3||datos.secretEye)return false;
 if(Math.random()<0.25){datos.secretEye=true;save();return true}
 return false;
}
function claimSecret(){
 if(!datos.secretEye||!juego)return;
 const idx=0;
 if(idx>=3)return;
 datos.secretTrophies[idx]=true;datos.secretFound++;
 datos.trofeos=Math.min(100,datos.trofeos+1);datos.puntos+=25;datos.monedas+=15;
 datos.secretEye=false;save();clearInterval(timer);
 const fb=document.getElementById("fb");if(fb){fb.textContent="🌈 ¡TROFEO SECRETO ENCONTRADO! Ejercicio salteado.";fb.style.color="var(--yellow)"}
 const el=document.getElementById("secretEyeEvent");if(el)el.remove();
 setTimeout(()=>{if(juego?.level==="muy-desafio")nextChallenge();else if(juego?.level==="pesadilla")nextNight();else if(juego?.level==="piola")nextPiola();else nextQ()},1200);
}
function piola(){closeM();juego={level:"piola",total:6,n:0,correct:0,wrong:0,streak:0,time:40,position:9,stability:100,piola:true};nextPiola()}
function nextPiola(){if(juego.n>=juego.total){finishPiola();return}juego.q=qNormal("basic");juego.n++;juego.time=40;renderPiola();runTimer()}
function renderPiola(){renderGame(true)}
function finishPiola(){clearInterval(timer);datos.partidas++;if(!datos.secretTrophies[1]){datos.secretTrophies[1]=true;datos.secretFound++;}addTrophies(2);datos.puntos+=20;datos.monedas+=20;save();shell(`<div class="card result"><div class="big">😎🌈</div><h2>¡MODO PIOLA COMPLETADO!</h2><p>El muñequito sobrevivió tranqui.</p><div class="note">Ganaste <b>+${trophyReward(2)} trofeos</b> con tu skin 1,25×.</div><button class="primary" onclick="menu()">VOLVER</button></div>`) }

function shell(content){
 updateDay();
 document.body.className=datos.tema==="light"?"light":"";
 document.getElementById("app").innerHTML=`<div class="wrap">
 <div class="top"><div class="brandmini"><div class="minilogo"><span>Σ</span></div><div>MateLabs<br><small class="tiny">Entrená tu mente</small></div></div>
 <button class="icon" onclick="theme()"> ${datos.tema==="dark"?"☀️":"🌙"} </button></div>
 ${content}<footer>MateLabs 3.7 • Progreso guardado localmente</footer></div>`;
}

function login(){
 document.getElementById("app").innerHTML=`<div class="screen"><div class="card login">
 <div class="brand"><div class="logo"><span>Σ</span></div><h1 class="gradient">MateLabs</h1><div class="sub">Entrená tu mente</div></div>
 <div class="field"><label>CONTRASEÑA</label><input id="pass" type="password" placeholder="Ingresá tu contraseña" onkeydown="if(event.key==='Enter')enter()"></div>
 <button class="primary" onclick="enter()">INICIAR →</button><div id="err" class="error"></div>
 </div></div>`;
}
function enter(){if(document.getElementById("pass").value.toLowerCase()===CONTRASENA.toLowerCase())menu();else document.getElementById("err").textContent="Contraseña incorrecta."}

function menu(){
 const r=rank(),n=nextRank();
 shell(`<section class="card hero"><div class="tiny">NIVEL ${datos.nivel} • ${datos.avatar}</div>
 <h2>${r[1]}</h2><div class="tag">🏆 ${datos.trofeos}/100 • 🪙 ${datos.monedas}</div>
 <div class="progress"><i style="width:${rankPct()}%"></i></div>
 <div class="row tiny"><span>${r[1]}</span><span>${n?n[1]+" • "+n[0]+" 🏆":"LEYENDA"} </span></div>
 <div class="progress"><i style="width:${datos.xp/xpNeeded()*100}%"></i></div>
 <div class="row tiny"><span>XP ${datos.xp}/${xpNeeded()}</span><span>Nivel ${datos.nivel}</span></div></section>
 <div class="stats"><div class="stat"><b>🏆 ${datos.trofeos}</b><span>Trofeos</span></div><div class="stat"><b>⭐ ${datos.puntos}</b><span>Puntos</span></div><div class="stat"><b>🎮 ${datos.partidas}</b><span>Partidas</span></div><div class="stat"><b>🔥 ${datos.mejorRacha}</b><span>Mejor racha</span></div></div>
 <div class="section"><h3>🧠 Entrenamiento</h3><div class="menu">
 <button onclick="difficulties()">🧮<strong>Jugar</strong><small>Ejercicios según tu nivel.</small></button>
 <button onclick="nightLogin()">☠️<strong>Modo Pesadilla</strong><small>5 desafíos extremos.</small></button>
 <button onclick="challenge()">⚔️<strong>Muy Desafío</strong><small>La dificultad sube cada ronda.</small></button>
 <button onclick="piola()">😎<strong>Modo Muñequito Piola</strong><small>6 ejercicios tranquilos + secretos.</small></button>
 <button onclick="miniGames()">🎮<strong>Mini juegos</strong><small>3 juegos rápidos para ganar puntos y trofeos.</small></button>
 <button onclick="daily()">📅<strong>Reto diario</strong><small>${datos.retoDia?"✅ Completado":"+2 puntos disponibles"}</small></button>
 <button onclick="trophies()">🌈<strong>Trofeos y secretos</strong><small>Encontrá los 3 trofeos !!!</small></button>
 <button onclick="ranks()">👑<strong>Rangos y ligas</strong><small>Subí hasta Leyenda.</small></button>
 <button onclick="stats()">📊<strong>Estadísticas</strong><small>Precisión y progreso.</small></button>
 <button onclick="shop()">🛍️<strong>Tienda</strong><small>Usá tus monedas.</small></button>

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function qNormal(level){
 if(level==="basic"){let a=rand(4,40),b=rand(2,20),o=rand(0,2);return o===0?{q:`${a}+${b}`,a:a+b}:o===1?{q:`${a}−${b}`,a:a-b}:{q:`${a}×${b}`,a:a*b}}
 if(level==="intermediate"){let a=rand(3,20),b=rand(2,12),c=rand(1,15);return Math.random()<.5?{q:`${a}×${b}+${c}`,a:a*b+c}:{q:`${a*b}÷${b}`,a:a}}
 let a=rand(3,14),b=rand(2,10),c=rand(2,8);return Math.random()<.5?{q:`(${a}+${b})×${c}`,a:(a+b)*c}:{q:`${a}²−${b}×${c}`,a:a*a-b*c}
}

function start(level){closeM();juego={level,total:10,n:0,correct:0,wrong:0,streak:0,time:30,position:9,stability:100};nextQ()}
function nextQ(){if(juego.n>=juego.total)return finish();juego.q=qNormal(juego.level);juego.n++;juego.time=30;renderGame();runTimer()}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{juego.time--;document.getElementById("time")?.replaceChildren("⏱️ "+juego.time+" s");if(juego.time<=0){clearInterval(timer);answer(false,true)}},1000)}

}

function animate(ok){
 const arena=document.getElementById("arena"),ch=document.getElementById("char");
 if(!arena||!ch)return;
 if(ok){
   juego.position=Math.min(82,9+juego.correct*7);
   ch.style.left=juego.position+"%";
   arena.classList.add("advance");
   setTimeout(()=>arena.classList.remove("advance"),650);
 }else{
   juego.stability=Math.max(0,100-(juego.wrong/juego.total)*100);
   const st=document.getElementById("stability");
   if(st){st.textContent="🛡️ "+Math.round(juego.stability)+"%";st.classList.toggle("danger",juego.stability<=20)}
   arena.classList.add("hit");
   setTimeout(()=>arena.classList.remove("hit"),5000);
 }
}

function makeFall(){
 const arena=document.getElementById("arena"),ch=document.getElementById("char");if(!arena)return;
 arena.classList.remove("hit");arena.classList.add("hanging");
 const fb=document.getElementById("fb");
 if(fb){fb.textContent="🫳 ¡AGARRADO! Último golpe...";fb.style.color="var(--red)"}
 setTimeout(()=>{
   arena.classList.remove("hanging");arena.classList.add("fall");
   if(fb)fb.textContent="💥 ¡SE CAYÓ! Perdiste la partida.";

 },5000);
}

function challenge(){juego={level:"muy-desafio",total:12,n:0,correct:0,wrong:0,streak:0,time:25,diff:1,position:9,stability:100};nextChallenge()}
function qChallenge(){
 let d=Math.min(6,1+Math.floor(juego.n/2)),a=rand(3,8+d),b=rand(2,7+d),c=rand(1,6+d);
 if(d<3)return Math.random()<.5?{q:`${a}×${b}−${c}`,a:a*b-c}:{q:`(${a}+${b})×${c}`,a:(a+b)*c};
 return Math.random()<.5?{q:`${a}²−${b}×${c}`,a:a*a-b*c}:{q:`(${a}+${b})²−${c}²`,a:(a+b)**2-c*c};
}
function nextChallenge(){if(juego.n>=juego.total)return finishChallenge();juego.q=qChallenge();juego.n++;juego.time=Math.max(12,25-Math.floor(juego.n/3));renderChallenge();runTimer()}

function challengeAnswer(){if(!juego)return;clearInterval(timer);let raw=document.getElementById("ans")?.value?.replace(",",".")||"";let ok=raw!==""&&Math.abs(Number(raw)-juego.q.a)<.0001;datos.ejerciciosTotales++;if(ok){datos.correctasTotales++;juego.correct++;juego.streak++;addXP(20);datos.puntos+=5;datos.monedas+=3;document.getElementById("fb").textContent="⚡ ¡Avanzás de ronda!";document.getElementById("fb").style.color="var(--green)"}else{juego.streak=0;juego.wrong++;document.getElementById("fb").textContent="❌ ¡FALLIDO! ⚔️";document.getElementById("fb").style.color="var(--red)"}animate(ok);save();if(!ok&&juego.wrong>=juego.total){makeFall();return}setTimeout(nextChallenge,5000)}
function finishChallenge(){clearInterval(timer);datos.partidas++;if(juego.correct===12){datos.trofeos=Math.min(100,datos.trofeos+3);datos.monedas+=30}save();shell(`<div class="card result"><div class="big">⚔️${juego.correct===12?"🏆":"🧠"}</div><h2>${juego.correct===12?"¡MUY DESAFÍO SUPERADO!":"Desafío terminado"}</h2><p>${juego.correct}/12 correctas</p><button class="primary" onclick="menu()">VOLVER</button></div>`)}

function miniGames(){
 const wins=datos.miniWins||[false,false,false];
 modal(`<div class="modalhead"><h2>🎮 Mini juegos</h2><button class="close" onclick="closeM()">×</button></div>
 <p class="tiny">Tres juegos cortos. Cada uno puede darte un trofeo la primera vez que lo superás.</p>
 <div class="choicegrid mini-grid" style="margin-top:12px">
  <div class="item"><span class="ico">⚡</span><b>Reflejos</b><small>Esperá el verde y tocá rápido.</small><button class="secondary" style="margin-top:8px" onclick="reactionGame()">JUGAR ${wins[0]?'✅':''}</button></div>
  <div class="item"><span class="ico">🧠</span><b>Memoria</b><small>Recordá la secuencia de luces.</small><button class="secondary" style="margin-top:8px" onclick="memoryGame()">JUGAR ${wins[1]?'✅':''}</button></div>
  <div class="item"><span class="ico">🔢</span><b>Número relámpago</b><small>Resolvé 5 cuentas contra reloj.</small><button class="secondary" style="margin-top:8px" onclick="flashGame()">JUGAR ${wins[2]?'✅':''}</button></div>
 </div>`)
}
function miniReward(i,points,coins){
 datos.monedas+=coins;datos.puntos+=points;addXP(points);
 let trophy=0;
 if(!(datos.miniWins||[])[i]){if(!datos.miniWins)datos.miniWins=[false,false,false];datos.miniWins[i]=true;trophy=trophyReward(1);datos.trofeos=Math.min(100,datos.trofeos+trophy)}
 save();return trophy;
}
function reactionGame(){
 let phase='wait',start=0,timerId=null;
 function draw(){modal(`<div class="modalhead"><h2>⚡ Reflejos</h2><button class="close" onclick="clearTimeout(timerId);closeM()">×</button></div>
 <div class="reaction-box ${phase==='go'?'go':''}" id="reactionBox" onclick="hit()"><b>${phase==='wait'?'ESPERÁ...':'¡TOCÁ!'}</b><small>${phase==='wait'?'Cuando cambie, tocá lo más rápido posible.':'¡AHORA MISMO!'}</small></div><div id="reactionMsg" class="feedback"></div>`)}
 window.hit=function(){
  if(phase==='wait'){phase='early';clearTimeout(timerId);draw();return}
  if(phase==='go'){let ms=Date.now()-start;let t=miniReward(0,Math.max(5,30-Math.floor(ms/50)),10);phase='done';draw();document.getElementById('reactionMsg').innerHTML=`⚡ <b>${ms} ms</b><br>¡Muy rápido! +${t} 🏆${t?' y recompensas.':''}<br><button class="primary" style="margin-top:10px" onclick="miniGames()">VOLVER</button>`;}
 }
 draw();
 timerId=setTimeout(()=>{if(phase==='wait'){phase='go';start=Date.now();draw()}},1200+Math.random()*2800);
}
function memoryGame(){
 let seq=[],user=[],round=0,showing=false;
 function newRound(){round++;user=[];showing=true;seq.push(Math.floor(Math.random()*4));draw();let i=0;const iv=setInterval(()=>{let el=document.getElementById('m'+seq[i]);if(el){el.classList.add('lit');setTimeout(()=>el.classList.remove('lit'),300)}i++;if(i>=seq.length){clearInterval(iv);showing=false;document.getElementById('memoryMsg').textContent='Ahora repetí la secuencia.'}},500)}
 function draw(){modal(`<div class="modalhead"><h2>🧠 Memoria</h2><button class="close" onclick="closeM()">×</button></div><p class="tiny">Ronda ${round+1}/5</p><div class="memory-grid">${[0,1,2,3].map(i=>`<button id="m${i}" onclick="pick(${i})"></button>`).join('')}</div><div id="memoryMsg" class="feedback">Preparando...</div>`)}
 window.pick=function(i){if(showing)return;user.push(i);document.getElementById('m'+i)?.classList.add('lit');setTimeout(()=>document.getElementById('m'+i)?.classList.remove('lit'),180);let k=user.length-1;if(user[k]!==seq[k]){draw();document.getElementById('memoryMsg').innerHTML=`❌ Te equivocaste en la ronda ${round}.<br><button class="secondary" style="margin-top:10px" onclick="miniGames()">VOLVER</button>`;return}if(user.length===seq.length){if(round>=5){let t=miniReward(1,40,20);draw();document.getElementById('memoryMsg').innerHTML=`🧠🌈 ¡Memoria completada! +${t} 🏆<br><button class="primary" style="margin-top:10px" onclick="miniGames()">VOLVER</button>`}else setTimeout(newRound,450)}}
 newRound();
}
function flashGame(){
 let n=0,correct=0,a=0,b=0,op='',ans=0,timerId=null;
 function next(){n++;a=rand(8,45);b=rand(2,15);let type=Math.floor(Math.random()*3);if(type===0){op='+';ans=a+b}else if(type===1){op='−';if(b>a)[a,b]=[b,a];ans=a-b}else{op='×';a=rand(2,12);b=rand(2,9);ans=a*b}draw();document.getElementById('flashAns')?.focus()}
 function draw(){modal(`<div class="modalhead"><h2>🔢 Número relámpago</h2><button class="close" onclick="clearTimeout(timerId);closeM()">×</button></div><div class="pill">CUENTA ${n}/5</div><div class="q">${a} ${op} ${b}</div><input id="flashAns" class="answer" inputmode="numeric" placeholder="Respuesta" onkeydown="if(event.key==='Enter')answer()"><button class="primary" onclick="answer()">RESPONDER</button><div id="flashMsg" class="feedback">⏱️ Tenés 8 segundos.</div>`);let left=8;timerId=setInterval(()=>{left--;let m=document.getElementById('flashMsg');if(m)m.textContent=`⏱️ ${left} segundos`;if(left<=0){clearInterval(timerId);finish(false,'⏰ Tiempo agotado.')}},1000);setTimeout(()=>document.getElementById('flashAns')?.focus(),30)}
 function answer(){clearInterval(timerId);let v=Number(document.getElementById('flashAns')?.value);if(v===ans)correct++;if(n>=5){finish(correct===5,`Acertaste ${correct}/5.`)}else setTimeout(next,250)}
 function finish(win,msg){let t=win?miniReward(2,50,25):0;modal(`<div class="result"><div class="big">${win?'⚡🏆':'🧮'}</div><h2>${win?'¡COMPLETADO!':'Fin del juego'}</h2><p>${msg}</p><div class="note">${win?`+${t} 🏆 y recompensas.`:'Podés intentarlo de nuevo.'}</div><button class="primary" onclick="miniGames()">VOLVER</button></div>`)}
 window.answer=answer;next();
}

  '☠️ Superá Modo Pesadilla con las 5 respuestas correctas para desbloquearlo.'
 ];
 modal(`<div class="result"><div class="big">${unlocked?"🌈🏆":"🌈❓"}</div><h2>${unlocked?"¡Trofeo secreto encontrado!":"Trofeo secreto !!!"}</h2><p>${methods[i]}</p><div class="note">${unlocked?"DESBLOQUEADO":"Todavía oculto."}</div><button class="primary" onclick="trophies()">VOLVER</button></div>`)
}
function ranks(){modal(`<div class="modalhead"><h2>👑 Rangos</h2><button class="close" onclick="closeM()">×</button></div><div class="choicegrid">${RANGOS.map(x=>`<div class="item ${rank()[1]===x[1]?"current":""}"><b>${x[1]}</b><small>${x[0]} trofeos</small></div>`).join("")}</div><div class="note">Liga actual: <b>${datos.liga}</b></div>`)}
function stats(){let total=datos.ejerciciosTotales,p=total?Math.round(datos.correctasTotales/total*100):0;let h=datos.historial.length?datos.historial:[0];modal(`<div class="modalhead"><h2>📊 Estadísticas</h2><button class="close" onclick="closeM()">×</button></div><div class="stats"><div class="stat"><b>${total}</b><span>Ejercicios</span></div><div class="stat"><b>${datos.correctasTotales}</b><span>Correctas</span></div><div class="stat"><b>${p}%</b><span>Precisión</span></div><div class="stat"><b>${datos.nivel}</b><span>Nivel</span></div></div><h3 style="margin:18px 0 8px">Últimas respuestas</h3><div class="chart">${h.map(x=>`<div class="bar" style="--h:${x?"90%":"25%"}"></div>`).join("")}</div>`)}
function shop(){modal(`<div class="modalhead"><h2>🛍️ Skins</h2><button class="close" onclick="closeM()">×</button></div><p class="tiny">Monedas: 🪙 ${datos.monedas} • <b>Skin equipada: ${datos.avatar} • 1,25× trofeos</b></p><div class="choicegrid" style="margin-top:12px"><div class="item"><span>🧠</span><b>Avatar Cerebro</b><small>Gratis • +1,25× trofeos</small><button class="secondary" style="margin-top:8px" onclick="equipSkin('🧠')">EQUIPAR</button></div><div class="item"><span>⚡</span><b>Avatar Rayo</b><small>100 monedas • +1,25× trofeos</small><button class="secondary" style="margin-top:8px" onclick="buy(100,'⚡')">Comprar</button></div><div class="item"><span>🤖</span><b>Avatar Robot</b><small>200 monedas • +1,25× trofeos</small><button class="secondary" style="margin-top:8px" onclick="buy(200,'🤖')">Comprar</button></div><div class="item"><span>😎</span><b>Skin Piola</b><small>300 monedas • +1,25× trofeos</small><button class="secondary" style="margin-top:8px" onclick="buy(300,'😎')">Comprar</button></div></div>`)}
function equipSkin(av){datos.avatar=av;datos.skinMultiplier=1.25;save();closeM();menu()}
function buy(cost,av){if(datos.monedas<cost){alert("No tenés suficientes monedas.");return}datos.monedas-=cost;datos.avatar=av;datos.skinMultiplier=1.25;save();closeM();menu()}
function daily(){if(datos.retoDia){modal(`<div class="result"><div class="big">✅</div><h2>Reto completado</h2><p>Ya ganaste tus +2 puntos hoy.</p><button class="primary" onclick="closeM()">VOLVER</button></div>`);return}let a=rand(12,40),b=rand(2,12),ans=a+b;modal(`<div class="game"><span class="pill">RETO DIARIO</span><div class="q">${a}+${b}</div><input id="da" class="answer" inputmode="numeric" placeholder="Respuesta"><button class="primary" onclick="dailyCheck(${ans})">COMPROBAR</button><div id="de" class="error"></div></div>`)}
function dailyCheck(ans){if(Number(document.getElementById("da").value)===ans){datos.retoDia=true;datos.puntos+=2;addXP(10);save();closeM();menu()}else document.getElementById("de").textContent="No es correcto. ¡Probá de nuevo!"}
function resetProgress(){if(confirm("¿Seguro que querés eliminar TODO el progreso? Esta acción no se puede deshacer.")){localStorage.removeItem("matelabsDatos");location.reload()}}
updateDay();login();
</script>
</body>
</html>
